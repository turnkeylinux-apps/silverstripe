ServerName localhost

<VirtualHost *:80>
    UseCanonicalName Off
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/silverstripe/public/
</VirtualHost>

<VirtualHost *:443>
    SSLEngine on
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/silverstripe/public/
</VirtualHost>

<Directory /var/www/silverstripe/public/>
    Options +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
